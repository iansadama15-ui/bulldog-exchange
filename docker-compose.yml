services:
  db:
    build: ./db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bulldog_exchange
    volumes:
      - mysql_data:/var/lib/mysql

  catalog-api:
    build: ./catalog-api
    restart: always
    depends_on:
      - db

  order-api:
    build: ./order-api
    restart: always
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: always

  proxy:
    build: ./proxy
    restart: always
    ports:
      - "80:80"
    depends_on:
      - frontend
      - catalog-api
      - order-api

volumes:
  mysql_data: